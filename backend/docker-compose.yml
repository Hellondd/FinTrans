version: '3.9'

services:
  db:
    image: postgres:16
    container_name: fintrans-postgres
    restart: always
    environment:
      POSTGRES_USER: fintrans
      POSTGRES_PASSWORD: fintrans123
      POSTGRES_DB: fintrans_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrans"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: fintrans-backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

volumes:
  postgres_data:
